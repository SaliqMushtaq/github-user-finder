<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub User Finder</title>
    <link rel="stylesheet" href="style.css">

</head>

<body>
    <main class="container">
        <h1>GitHub User Finder</h1>
        <form id="searchForm" class="search-box" novalidate>
            <label class="visually-hidden" for="username">GitHub username</label>
            <input
                type="text"
                id="username"
                placeholder="Enter GitHub Username"
                autocomplete="off"
            >
            <button id="searchBtn" type="submit">Search</button>
        </form>
        <p id="message" role="status" aria-live="polite"></p>
        <section id="profile" class="profile hidden">
            <img id="avatar" src="" alt="">
            <h2 id="name"></h2>
            <p id="bio"></p>
            <div class="stats">
                <p>Followers: <span id="followers"></span></p>
                <p>Following: <span id="following"></span></p>
                <p>Public Repos: <span id="repos"></span></p>
            </div>
   <a id="profile-link" href="#" target="_blank" rel="noopener noreferrer">View GitHub Profile</a>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
